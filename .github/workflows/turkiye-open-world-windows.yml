name: Türkiye Open World - Windows x64

on:
  push:
    branches: [main, master]
    paths:
      - "TurkiyeOpenWorld/**"
      - ".github/workflows/turkiye-open-world-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: TurkiyeOpenWorld
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot 4.3 and export templates
        run: |
          $godotZip = "$env:RUNNER_TEMP\godot.zip"
          $templateTpz = "$env:RUNNER_TEMP\templates.tpz"
          $templateZip = "$env:RUNNER_TEMP\templates.zip"
          Invoke-WebRequest -Uri "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_win64.exe.zip" -OutFile $godotZip
          Expand-Archive -Path $godotZip -DestinationPath "$env:RUNNER_TEMP\godot" -Force
          $godot = Get-ChildItem "$env:RUNNER_TEMP\godot" -Filter "*console.exe" -Recurse | Select-Object -First 1
          if (-not $godot) { throw "Godot console executable missing after download." }
          "GODOT=$($godot.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Invoke-WebRequest -Uri "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz" -OutFile $templateTpz
          Copy-Item $templateTpz $templateZip -Force
          $templateStage = "$env:RUNNER_TEMP\template-stage"
          Expand-Archive -Path $templateZip -DestinationPath $templateStage -Force
          $templatesRoot = Join-Path $env:APPDATA "Godot\export_templates\4.3.stable"
          New-Item -ItemType Directory -Force -Path $templatesRoot | Out-Null
          Copy-Item "$templateStage\templates\*" $templatesRoot -Recurse -Force
          if (-not (Test-Path (Join-Path $templatesRoot "windows_release_x86_64.exe"))) {
            throw "Windows x86_64 release export template was not installed."
          }
          & $godot.FullName --version
          if ($LASTEXITCODE -ne 0) { throw "Godot version check failed." }

      - name: Import project and parse all scripts
        run: |
          & $env:GODOT --headless --editor --path . --quit
          if ($LASTEXITCODE -ne 0) { throw "Godot editor import/script parse failed: $LASTEXITCODE" }

      - name: Run headless scene smoke test
        run: |
          & $env:GODOT --headless --path . --quit-after 5
          if ($LASTEXITCODE -ne 0) { throw "Headless scene smoke test failed: $LASTEXITCODE" }

      - name: Export Windows 64-bit release
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          & $env:GODOT --headless --path . --export-release "Windows Desktop" build/TurkiyeOpenWorld.exe
          if ($LASTEXITCODE -ne 0) { throw "Windows export failed: $LASTEXITCODE" }
          if (-not (Test-Path "build/TurkiyeOpenWorld.exe")) { throw "EXE output missing." }
          if (-not (Test-Path "build/TurkiyeOpenWorld.pck")) { throw "PCK output missing." }

      - name: Package and verify deliverable
        run: |
          $zip = "TurkiyeOpenWorld_Windows_x64.zip"
          Compress-Archive -Path "build/TurkiyeOpenWorld.exe","build/TurkiyeOpenWorld.pck" -DestinationPath $zip -Force
          if (-not (Test-Path $zip)) { throw "ZIP output missing." }
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip))
          try {
            $names = $archive.Entries | ForEach-Object { $_.FullName }
            if ($names -notcontains "TurkiyeOpenWorld.exe" -or $names -notcontains "TurkiyeOpenWorld.pck") {
              throw "ZIP does not contain both EXE and PCK."
            }
          } finally { $archive.Dispose() }
          Get-Item "build/TurkiyeOpenWorld.exe","build/TurkiyeOpenWorld.pck",$zip | Format-Table Name,Length

      - name: Upload Windows x64 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: TurkiyeOpenWorld-Windows-x64
          path: TurkiyeOpenWorld/TurkiyeOpenWorld_Windows_x64.zip
          if-no-files-found: error
          retention-days: 14
